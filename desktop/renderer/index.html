<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boba Desktop</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="pet" class="pet mood-idle facing-right" title="Boba">
      <output id="fps" class="fps-badge">FPS --</output>
      <section id="info-panel" class="info-panel hidden" aria-live="polite">
        <button class="panel-close" type="button" data-close-panel="info" aria-label="关闭">×</button>
        <strong id="info-title"></strong>
        <p id="info-message"></p>
      </section>
      <form id="command-panel" class="command-panel hidden">
        <button class="panel-close" type="button" data-close-panel="command" aria-label="关闭">×</button>
        <input id="command-input" type="text" autocomplete="off" placeholder="&#36755;&#20837;&#65306;&#36339;&#33310; / &#26242;&#20572; / &#32487;&#32493; / &#22238;&#26469;">
        <button type="submit">&#25191;&#34892;</button>
      </form>
      <form id="settings-panel" class="settings-panel hidden">
        <button class="panel-close" type="button" data-close-panel="settings" aria-label="关闭">×</button>
        <strong>&#35774;&#32622;&#31649;&#29702;</strong>
        <label><input type="checkbox" name="showFps"> &#26174;&#31034; FPS</label>
        <label><input type="checkbox" name="autoDance"> &#33258;&#21160;&#36339;&#33310;</label>
        <label><input type="checkbox" name="allowMovement"> &#36731;&#24494;&#31227;&#21160;</label>
        <label><input type="checkbox" name="showBubbles"> &#26174;&#31034;&#23545;&#35805;&#27668;&#27873;</label>
        <label><input type="checkbox" name="lowPower"> &#20302;&#21344;&#29992;&#27169;&#24335;</label>
        <label><input type="checkbox" name="modelEnabled"> &#21551;&#29992;&#27169;&#22411;&#33021;&#21147;</label>
        <label class="settings-field">
          <span>&#21327;&#35758;</span>
          <select name="modelProtocol">
            <option value="openai-compatible">OpenAI-compatible</option>
            <option value="anthropic-compatible">Anthropic-compatible</option>
          </select>
        </label>
        <label class="settings-field">
          <span>Base URL</span>
          <input type="text" name="modelBaseUrl" autocomplete="off">
        </label>
        <label class="settings-field">
          <span>&#27169;&#22411;</span>
          <input type="text" name="modelName" autocomplete="off">
        </label>
        <label class="settings-field">
          <span>API Key</span>
          <input type="password" name="modelApiKey" autocomplete="off">
        </label>
      </form>
      <section id="bubble" class="bubble hidden">
        <p id="message">Boba &#27491;&#22312;&#24453;&#21629;&#12290;</p>
      </section>
      <section class="dragon" aria-label="Boba">
        <div class="tail"></div>
        <div class="body">
          <div class="belly"></div>
          <div class="arm arm-left"><span class="claws hand-claws"></span></div>
          <div class="arm arm-right"><span class="claws hand-claws"></span></div>
          <div class="foot foot-left"></div>
          <div class="foot foot-right"></div>
        </div>
        <div class="head">
          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>
          <div class="shine shine-left"></div>
          <div class="shine shine-right"></div>
          <div class="snout"></div>
          <div class="mouth"></div>
          <div class="cheek cheek-left"></div>
          <div class="cheek cheek-right"></div>
        </div>
        <div class="shadow"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
